# Two targets:
#   incluster -- used by the dbt-runner image when Kestra launches it as a
#                pod (kestra-plugins/plugin-dbt-k8s-runner/examples/02-dbt-run.yaml).
#   local     -- run from your machine through a port-forward:
#                kubectl -n tenant-a port-forward svc/trino 8080:8080
table_health:
  target: local
  outputs:
    incluster:
      type: trino
      method: none
      user: dbt
      host: trino.tenant-a.svc.cluster.local
      port: 8080
      http_scheme: http
      database: iceberg
      schema: default
      threads: 2
    local:
      type: trino
      method: none
      user: dbt
      host: localhost
      port: 8080
      http_scheme: http
      database: iceberg
      schema: default
      threads: 2
