# Run this AFTER 01-smoke-test.yaml passes. Needs a container image that
# has dbt + the ~/dbt_lab project baked in (see docker/dbt-runner.Dockerfile
# below, or build your own) -- phase 1 of this runner does not sync files
# from the worker into the Pod, so the image is the only way the dbt
# project gets there.
#
# containerImage below is a LOCAL-ONLY tag, deliberately not `:latest`
# and not pointing at any real registry: it's loaded straight into
# containerd with `k3s ctr images import` (see README's "load it into
# k3s" step), no registry involved. Once you actually push this
# somewhere real, update the tag here and set pullPolicy: Always.
id: dbt_run_k8s
namespace: tenant.data_eng

tasks:
  - id: dbt_run
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.lakehouse.k8s.KubernetesTaskRunner
      namespace: tenant-a-dbt-exec
      containerImage: dbt-runner:local
      podServiceAccount: default
      waitUntilCompletion: PT30M
      resources:
        cpuRequest: "250m"
        cpuLimit: "1"
        memoryRequest: "512Mi"
        memoryLimit: "1Gi"
    commands:
      - dbt run --project-dir /workspace/dbt --profiles-dir /workspace/dbt --target incluster
