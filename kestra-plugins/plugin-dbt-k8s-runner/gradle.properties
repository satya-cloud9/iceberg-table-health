# Own plugin version — unrelated to Kestra's own version.
version=0.1.0-SNAPSHOT

# Pinned to match the Kestra image actually deployed on satya-homelab
# (see helm-values/kestra-values.yaml -> image.tag). plugin-template's
# stock value here is 1.3.13 — bumped to keep this plugin's compileOnly
# io.kestra:core/:script/:platform deps binary-consistent with the host
# Kestra JVM that will actually load this plugin's jar at runtime.
kestraVersion=1.3.37

org.gradle.jvmargs=-XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError
