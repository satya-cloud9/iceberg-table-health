# Reference copy only — the version actually used by a running Trino pod
# is generated per-tenant by terraform/tenants/_template/trino.tf's
# `iceberg_catalog_properties` local (tenant_id and the storage endpoint
# get interpolated in there). Kept here so the shape of the config is easy
# to read/diff without digging through Terraform/Helm templating.
#
# catalog.type=rest points Trino's Iceberg connector at Nessie's REST
# catalog API (see terraform/platform/catalog.tf) instead of Glue — the
# multi-provider-correct choice, since Glue only exists on AWS. Nessie
# namespaces map 1:1 to tenants (uri path below), which is the mechanism
# behind the cross-tenant catalog grants described on the
# tenancy-architecture reference page.

connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://nessie.platform.svc.cluster.local:19120/iceberg
iceberg.rest-catalog.warehouse=tenant-<id>
fs.native-s3.enabled=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
s3.endpoint=http://minio.tenant-<id>.svc.cluster.local:9000
s3.path-style-access=true
s3.ssl.enabled=false
iceberg.file-format=PARQUET
