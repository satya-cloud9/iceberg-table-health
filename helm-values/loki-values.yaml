# Chart: grafana/loki — single-binary mode, filesystem storage. Not how
# you'd run Loki in production (no object storage backend, no HA) but the
# simplest configuration for a test rig, and the fastest to get logs
# flowing into Grafana.
# helm install loki grafana/loki -n observability -f helm-values/loki-values.yaml
#
# NOTE: this chart also needs Promtail (or Grafana Alloy) as a log
# shipper to actually get container logs into Loki — the `grafana/loki`
# chart doesn't bundle one by default in recent versions. If `make status`
# shows no logs arriving, `helm install promtail grafana/promtail
# --set loki.serviceName=loki -n observability` is the missing piece.

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  useTestSchema: true
deploymentMode: SingleBinary
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistence:
    enabled: true
    size: 10Gi

# Disable the chart's default extra components we don't need for a test rig.
gateway:
  enabled: false
test:
  enabled: false
