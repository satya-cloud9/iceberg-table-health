# Chart: kestra-io/kestra (https://helm.kestra.io) — repo: https://helm.kestra.io
# Applied via terraform/platform/kestra.tf as a helm_release, not run
# directly — this file is passed in as that release's values.
#
# Standalone deployment (webserver + executor + worker + scheduler in one
# process) against the Postgres deployed alongside it in kestra.tf. See
# that file's header comment for the upgrade path to Kestra 2.0's
# Controller/Worker-Group split once a second provider/cluster exists.
# Kestra's own documented minimum is 4Gi RAM / 2 vCPU standalone — the
# resources block below sits right at that floor; raise it if flows are
# slow to schedule/pick up.
#
# CHART SCHEMA CAVEAT: this was written from the Kestra Helm chart's
# documented shape, not verified against a live `helm install` (this repo
# was built in a sandbox without registry access). Run `helm show values
# kestra/kestra` first and reconcile any key names that have drifted before
# `helm install` — the `configuration:` block (Kestra's application.yaml)
# is the part most likely to need adjusting.

image:
  # repository below is a local-only fallback -- kestra.tf's helm_release
  # now overrides it with a `set` block pointing at
  # ghcr.io/<ghcr_username>/kestra-lakehouse instead (see that file and
  # variables.tf's ghcr_username/ghcr_token). This line only matters if
  # that override is ever removed; it does not need to be kept in sync.
  repository: kestra-lakehouse   # custom image: stock kestra/kestra + plugin-dbt-k8s-runner's jar
                                  # baked in via kestra-plugins/plugin-dbt-k8s-runner/docker/Dockerfile
  tag: v1.3.37-dbt-k8s-runner

# Secret name only -- not sensitive, safe to commit. The credentials this
# Secret actually holds come from kestra.tf's kubernetes_secret_v1.ghcr_pull,
# built from variables.tf's ghcr_username/ghcr_token (gitignored
# terraform.tfvars, never committed). See docs/ROADMAP.md's "Image
# distribution" section for why this moved off a purely local-only image.
imagePullSecrets:
  - name: ghcr-pull-secret
deployments:
  standalone:
    enabled: true
  webserver:
    enabled: false
  executor:
    enabled: false
  scheduler:
    enabled: false
  worker:
    enabled: false

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi

configurations:
  application:
    datasources:
      postgres:
        url: jdbc:postgresql://kestra-postgres.platform.svc.cluster.local:5432/kestra
        driverClassName: org.postgresql.Driver
        username: kestra
        password: kestra
    kestra:
      server:
        #basicAuth:
          #enabled: false
        basic-auth:
          username: admin@kestra.io
          password: Kestra2026
      repository:
        type: postgres
      storage:
        type: local
        local:
          base-path: "/app/storage"
      queue:
        type: postgres
      tasks:
        tmp-dir:
          path: /tmp/kestra-wd/tmp

persistence:
  enabled: true
  size: 10Gi

service:
  type: ClusterIP
  port: 8080

# Disabled -- the rootless dind sidecar this chart adds by default needs
# unprivileged user-namespace creation, which Ubuntu 23.10+/24.04's default
# AppArmor policy blocks ("rootlesskit: fork/exec /proc/self/exe: operation
# not permitted"). Nothing here uses the Docker task runner yet -- revisit
# this separately (either loosen the AppArmor policy on the host, or skip
# dind entirely in favor of a custom Kubernetes-pod-per-task runner plugin)
# once the platform itself is stable.
dind:
  enabled: false
