# Example flow proving the end-to-end path: Kestra -> Trino -> Iceberg
# (Nessie REST catalog for metadata, MinIO for the actual Parquet files).
# Points at tenant-a's Trino specifically -- Kestra itself is shared
# (platform namespace), but each flow/task targets one tenant's Trino
# endpoint, since queries run as/for that tenant. A second tenant means
# either a copy of this flow with the hostname swapped, or parameterizing
# the URL via a Kestra input if you want one flow reused across tenants.
# Deliberately minimal — inserts literal sample rows via SQL rather than
# staging external files, so the first run only has to prove the pipeline
# wiring, not a real ingestion pattern. Swap the `load_data` task for a
# `Copy`/`CopyIn` from a staged file (or an upstream source) once this
# runs cleanly.
#
# PLUGIN CAVEAT: uses io.kestra.plugin.jdbc.trino.Query, from the
# plugin-jdbc-trino plugin. If Kestra's default image doesn't include it,
# add `pluginDefaults`/an init container to install it, or check
# https://kestra.io/plugins for the current package name — plugin
# packaging has changed across Kestra versions and this hasn't been
# verified against a live install.

id: ingest-to-iceberg
namespace: lakehouse

tasks:
  - id: create_schema
    type: io.kestra.plugin.jdbc.trino.Query
    url: jdbc:trino://trino.tenant-a.svc.cluster.local:8080/iceberg/default
    username: kestra
    sql: CREATE SCHEMA IF NOT EXISTS iceberg.default

  - id: create_table
    type: io.kestra.plugin.jdbc.trino.Query
    url: jdbc:trino://trino.tenant-a.svc.cluster.local:8080/iceberg/default
    username: kestra
    sql: |
      CREATE TABLE IF NOT EXISTS iceberg.default.events (
        event_id    VARCHAR,
        event_type  VARCHAR,
        occurred_at TIMESTAMP(6),
        payload     VARCHAR
      )
      WITH (format = 'PARQUET')

  - id: load_data
    type: io.kestra.plugin.jdbc.trino.Query
    url: jdbc:trino://trino.tenant-a.svc.cluster.local:8080/iceberg/default
    username: kestra
    sql: |
      INSERT INTO iceberg.default.events VALUES
        ('evt-001', 'signup',      TIMESTAMP '2026-09-01 10:00:00', '{"plan":"free"}'),
        ('evt-002', 'signup',      TIMESTAMP '2026-09-01 10:05:00', '{"plan":"pro"}'),
        ('evt-003', 'page_view',   TIMESTAMP '2026-09-01 10:06:12', '{"path":"/pricing"}')

  - id: verify_count
    type: io.kestra.plugin.jdbc.trino.Query
    url: jdbc:trino://trino.tenant-a.svc.cluster.local:8080/iceberg/default
    username: kestra
    sql: SELECT count(*) AS row_count FROM iceberg.default.events
    fetchType: FETCH
    # On success, this task's output.rows should show row_count = 3 (plus
    # whatever accumulated from prior runs, since this flow doesn't
    # truncate the table first).

triggers: []   # manual/on-demand for now — add a Schedule trigger once this runs cleanly
